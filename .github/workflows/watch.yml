name: SniperJoe Waechter

on:
  schedule:
    - cron: "3 * * * *"   # jede Stunde, 3 Minuten nach der vollen Stunde (UTC), nach Kerzenschluss
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sniperjoe
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Waechter ausfuehren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: Gegenbewegung
          MIN_VOLUME_USD: "2000000"
        run: python watcher.py
      - name: Zustand speichern
        run: |
          git config user.name "sniperjoe-bot"
          git config user.email "sniperjoe-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Zustand aktualisiert" && git push)
