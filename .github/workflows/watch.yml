name: SniperJoe Waechter

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten; der Waechter tut nichts, wenn die Kerze schon verarbeitet ist
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/watch.yml"

permissions:
  contents: write

concurrency:
  group: sniperjoe
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Waechter ausfuehren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: Gegenbewegung
          MIN_VOLUME_USD: "2000000"
          MIN_R: "2.0"            # nur KAUF: Chance bis 10-Tage-Hoch in R (Stop = 1 Tages-ATR)
          MIN_BAND_PCT: "5.0"     # nur KAUF: Kanalbreite vor der Signalkerze in %
          MIN_DROP_ATR: "2.0"     # nur KAUF: Rueckgang in ATR innerhalb von 4 Kerzen
          MIN_VOL_RATIO: "2.0"    # nur KAUF: Volumen der Signalkerze x Schnitt der letzten 20 Kerzen
          TIMEFRAMES: "4h,1d"     # Zeitrahmen, kommagetrennt (moeglich: 1h, 4h, 1d)
          COOLDOWN_BARS: "6"      # Sperre pro Markt, Zeitrahmen und Richtung in Kerzen
        run: python watcher.py
      - name: Zustand speichern
        run: |
          git config user.name "sniperjoe-bot"
          git config user.email "sniperjoe-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Zustand aktualisiert" && git push)
