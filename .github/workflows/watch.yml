name: SniperJoe Waechter

on:
  schedule:
    - cron: "7,37 * * * *"   # zweimal pro Stunde (Minute 7 und 37 UTC); neue Kerzen werden nur einmal gemeldet
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/watch.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: sniperjoe
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Waechter ausfuehren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: Gegenbewegung
          MIN_VOLUME_USD: "2000000"
        run: python watcher.py
      - name: Zustand speichern
        run: |
          git config user.name "sniperjoe-bot"
          git config user.email "sniperjoe-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Zustand aktualisiert" && git push)
      - name: Naechsten Lauf planen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub-Cron ist unzuverlaessig. Deshalb startet sich der Workflow zur naechsten vollen Stunde (+60 s) selbst neu.
          now=$(date +%s)
          next=$(( (now / 3600 + 1) * 3600 + 60 ))
          wait=$(( next - now ))
          echo "Warte $wait Sekunden bis zum naechsten Lauf"
          sleep $wait
          gh workflow run watch.yml --ref main
